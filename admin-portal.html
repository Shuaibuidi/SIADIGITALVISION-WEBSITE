<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Smart Business Manager | S I A Tech Print Media</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f6f7;color:#263238}
header{height:58px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:12px}
header strong{font-size:14px}header button{border:0;border-radius:7px;background:#263238;color:#fff;padding:10px 14px;font-weight:700}
main{height:calc(100dvh - 58px);position:relative}iframe{width:100%;height:100%;border:0;display:block;background:#080b0e}
#notice{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#fff;line-height:1.6}
#notice[hidden]{display:none}#notice a{color:#e85f00;font-weight:700}
</style>
</head>
<body>
<header><strong>S I A TECH PRINT MEDIA · Business Manager</strong><button id="signOut" type="button">Sign out</button></header>
<main>
<iframe id="businessApp" title="Smart Business Manager" src="business-manager-app.html"></iframe>
<div id="notice">Verifying your administrator account and opening Smart Business Manager…</div>
</main>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
const config={apiKey:"AIzaSyAFP-RfZWPKPcHU9NqtTzX1b8HvVVzkb3Y",authDomain:"mobile-tech-room.firebaseapp.com",projectId:"mobile-tech-room",storageBucket:"mobile-tech-room.firebasestorage.app",messagingSenderId:"620229324084",appId:"1:620229324084:web:7e2ae7a2550228a4dfc961",measurementId:"G-GPJM1C83TT"};
const app=getApps().length?getApp():initializeApp(config),auth=getAuth(app);
const frame=document.getElementById("businessApp"),notice=document.getElementById("notice"),logout=document.getElementById("signOut");
let frameReady=false,userReady=false,activeUser=null,started=false;
function show(message,withFallback=false){
 notice.hidden=false;notice.replaceChildren();
 const p=document.createElement("p");p.textContent=message;notice.append(p);
 if(withFallback){const a=document.createElement("a");a.href="business-manager-app.html";a.textContent="Open normal Business Manager login";notice.append(a)}
}
async function startSso(){
 if(!frameReady||!userReady||!activeUser||started)return;
 started=true;show("Verifying your administrator account…");
 try{
  const idToken=await activeUser.getIdToken();
  const response=await fetch("https://starter-function-9cke.sgp.appwrite.run/?action=sia-admin-sso",{
   method:"POST",headers:{"Authorization":"Bearer "+idToken,"Content-Type":"application/json"},body:"{}"
  });
  const result=await response.json();
  if(!response.ok||!result.success||!result.customToken)throw new Error(result.error||"Your account could not be matched to an active Smart Business Manager administrator.");
  frame.contentWindow.postMessage({type:"SIA_BUSINESS_SSO_TOKEN",customToken:result.customToken},location.origin);
  notice.hidden=true;
 }catch(error){
  started=false;
  show((error.message||"Single sign-in failed.")+" Your existing Business Manager login has not been changed.",true);
 }
}
frame.addEventListener("load",()=>{frameReady=true;startSso()});
onAuthStateChanged(auth,user=>{
 activeUser=user;userReady=true;
 if(!user){location.replace("account.html");return}
 startSso();
});
logout.addEventListener("click",async()=>{
 frame.contentWindow?.postMessage({type:"SIA_BUSINESS_SIGN_OUT"},location.origin);
 try{await signOut(auth)}finally{location.replace("account.html")}
});
</script>
</body>
</html>
